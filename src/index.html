<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CELC Financeiro</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/configuracoes.css"><link rel="stylesheet" href="css/login.css"></head><body>
<aside class="sidebar"><div class="brand"><img src="assets/celc-logo.png" alt="Colégio CELC"></div><nav id="menu"><button data-tela="dashboard" class="active">Visão geral</button><button data-tela="caixa">Caixa diário</button><button data-tela="devedores">Alunos devedores</button><button data-tela="entradas">Entradas</button><button data-tela="despesas">Despesas</button><button data-tela="receber">Contas a receber</button><button data-tela="pagar">Contas a pagar</button><button data-tela="categorias">Categorias</button><button data-tela="relatorios">Relatórios</button></nav><div class="sidebar-bottom"><button data-tela="configuracoes">Configurações</button><div class="profile"><div class="avatar">CE</div><div><b>Direção CELC</b><small>Acesso administrador</small></div></div></div></aside>
<main><header><div><p class="eyebrow" id="rotulo">PAINEL FINANCEIRO</p><h1 id="titulo">Visão geral</h1><p class="subtitle" id="subtitulo">Acompanhe a saúde financeira do Colégio CELC.</p></div><div class="header-actions"><button class="outline-button" id="backup">Backup</button><button class="primary-action" id="novo">Novo lançamento</button></div></header><div id="conteudo"></div></main>
<div class="modal-backdrop show" id="login"><form class="modal" id="formLogin"><img class="login-logo" src="assets/celc-logo.png" alt="CELC"><p class="eyebrow">ACESSO SEGURO</p><h2>CELC Financeiro</h2><label>Usuário<input id="loginUsuario" autocomplete="username" required></label><label>Senha<input id="loginSenha" type="password" autocomplete="current-password" required></label><p id="loginErro" class="form-feedback"></p><button class="primary-action">Entrar</button><small>Primeiro acesso: admin / admin123</small></form></div>
<div class="modal-backdrop" id="modal"><form class="modal" id="formLancamento"><button type="button" class="close" id="fechar">×</button><p class="eyebrow" id="modalRotulo">NOVO LANÇAMENTO</p><h2 id="modalTitulo">Registrar movimentação</h2><label>Descrição<input name="descricao" required></label><div class="two-columns"><label>Tipo<select name="tipo"><option value="entrada">Entrada</option><option value="despesa">Despesa</option></select></label><label>Valor (R$)<input name="valor" type="number" step="0.01" min="0.01" required></label></div><div class="two-columns"><label>Categoria<select name="categoriaId" required></select></label><label>Pagamento<select name="liquidacao"><option value="aberto">Ainda não realizado</option><option value="realizado">Realizado hoje</option></select></label></div><div class="two-columns"><label>Competência<input name="competencia" type="date" required></label><label>Vencimento<input name="vencimento" type="date"></label></div><label>Recorrência<select name="recorrencia"><option value="avulso">Lançamento avulso</option><option value="mensal">Repetir mensalmente</option></select></label><p class="form-feedback" id="erroLancamento"></p><button class="primary-action">Salvar lançamento</button></form></div>
<script src="js/neutralino.js"></script><script src="js/vendor/sql-wasm.js"></script><script type="module" src="js/app.js"></script></body></html>
